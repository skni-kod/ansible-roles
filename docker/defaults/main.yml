# DOCKER ROLE DEFAULTS

docker_users:
  - skni-technical-user

docker_apt_url: https://download.docker.com/linux/ubuntu
docker_apt_gpg_key_url: "{{ docker_apt_url }}/gpg"

# Override with e.g. "noble" if Docker has no packages for your Ubuntu release.
docker_apt_suite: "{{ ansible_distribution_release }}"

docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
