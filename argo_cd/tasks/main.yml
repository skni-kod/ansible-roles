# ARGO-CD ROLE

- name: Create ArgoCD namespace
  ansible.builtin.command: kubectl create namespace argocd
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config
  register: create_argocd_ns
  changed_when: "create_argocd_ns.rc == 0"
  failed_when: "create_argocd_ns.rc != 0 and 'AlreadyExists' not in create_argocd_ns.stderr"

- name: Install ArgoCD resources
  ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config
  register: install_argocd
  changed_when: "'created' in install_argocd.stdout or 'configured' in install_argocd.stdout"
